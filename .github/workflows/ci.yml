name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build & Test (with Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub-hosted ubuntu-latest runners ship with a working Docker daemon
    # that Testcontainers can use directly. No docker-in-docker setup required.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Docker is available for Testcontainers
        run: |
          docker --version
          docker info | head -20

      # Fast unit-test pass — covers every module's plain unit tests and
      # the NoOpKafkaProducerIT (which does not need Docker).
      - name: Run unit tests
        working-directory: .
        run: ./mvnw -B test

      # Package the monolith so the assembly step is exercised in CI too.
      - name: Package monolith
        working-directory: .
        run: ./mvnw -B -pl dataops-platform-monolith -am package -DskipTests

      # Run Testcontainers-backed integration tests. These spin up real
      # Postgres and Kafka containers. They require Docker, which the
      # ubuntu-latest runner provides out of the box.
      - name: Run Testcontainers-backed integration tests
        working-directory: .
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: |
          ./mvnw -B -pl module-06-streaming-kafka,dataops-platform-monolith \
            -Dtest='KafkaEndToEndIT,*IntegrationTest,*IT' \
            -DrunDockerIT=true \
            -DfailIfNoTests=false \
            test

      - name: Upload fat JAR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dataops-platform-monolith
          path: dataops-platform-monolith/target/dataops-platform-monolith-0.0.1-SNAPSHOT.jar
          retention-days: 7
