services:
  postgres:
    image: postgres:15
    container_name: dataops-postgres
    environment:
      POSTGRES_DB: dataops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  dataops-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataops-monolith
    ports:
      - "8080:8080"
    environment:
      APP_KAFKA_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dataops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # REQUIRED: supply a real API key. A secure default is provided for local compose usage.
      API_KEY: ${API_KEY:-dataops-secure-api-key-2026}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
